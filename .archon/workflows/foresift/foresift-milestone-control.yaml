name: foresift-milestone-control
description: |
  Foresift milestone lifecycle control. Modes are selected deterministically by
  preflight state inspection (never by AI):

  Mode A (PLAN) — plan the next milestone: read the authoritative PRD +
  requirement manifest, decompose the first eligible dependency group into 2-8
  outcome-oriented work packages inside a BOUNDED CONTINUATION LOOP (each
  iteration continues partial planning persisted on disk; completion is decided
  by the deterministic milestone validator, never by an AI promise), run an
  independent fresh-context planning review, repair CRITICAL/HIGH findings,
  re-validate deterministically, and land through a normal PR (CI + machine
  squash merge).

  Mode B (AUDIT / AUDIT_FINAL) — audit/close a fully-proven milestone inside a
  bounded fresh-context continuation loop driven by a durable audit-progress
  artifact ($ARTIFACTS_DIR/milestone-audit-progress.json) so the audit survives
  any number of Claude turn boundaries. Gaps become narrowly scoped remediation
  packages in the SAME milestone (landed via PR). If no gaps exist, the
  milestone is archived as PROVEN to history/. At the final milestone G7 a
  product-wide audit of EVERY requirement replaces planning.

  A Claude turn ending cleanly is NOT stage completion: every long stage here
  loops under a deterministic `until_bash` guard (the `until` text signals are
  sentinels agents are instructed NEVER to emit). Loop exhaustion fails the
  stage; recovery belongs to the autopilot supervisor.

  ARCHON v0.9.0 LOOP SEMANTICS this layout relies on (verified empirically):
    - every loop iteration runs its FULL body before the guard is evaluated;
    - `when:` inside a loop body CANNOT see same-iteration sibling outputs, so
      conditional AI gating is done by TOP-LEVEL status nodes routing around
      whole loops, and loop bodies run unconditionally (repair -> re-check);
    - loop-body siblings WITHOUT an explicit depends_on edge run CONCURRENTLY,
      so AI->recheck pairs are always serialized with depends_on;
    - prompt interpolation CAN read top-level and same-iteration siblings;
    - `trigger_rule` supports all_success | one_success |
      none_failed_min_one_success | all_done.

  Invoke via the autopilot supervisor. NOT for implementing a work package (use
  foresift-work-package).

provider: claude
effort: high
tags: [foresift, autonomous]

nodes:
  # ── MODE SELECTION + REPOSITORY VERIFICATION (deterministic) ───────────────
  - id: mode-select
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/milestone-mode.mjs > "$ARTIFACTS_DIR/mode.json"
      cat "$ARTIFACTS_DIR/mode.json"
    timeout: 120000

  - id: stop-noop
    cancel: "Milestone-control invoked but there is nothing to plan or audit."
    depends_on: [mode-select]
    when: "$mode-select.output.mode == 'NONE'"

  # ── MODE A ROUTER: deterministic planning-completeness check ────────────────
  # Top-level (loop-external) deterministic status: the ONLY thing allowed to
  # decide whether the bounded planning loop must run. Runs once per workflow.
  - id: mc-plan-status
    depends_on: [mode-select]
    when: "$mode-select.output.mode == 'PLAN'"
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/milestone-validate.mjs --expect-next \
        > "$ARTIFACTS_DIR/plan-completeness.json" 2>&1
      if [ $? -eq 0 ] && [ -s "$ARTIFACTS_DIR/milestone-plan-rationale.md" ]; then
        echo "MC_PLAN_COMPLETE"
      else
        echo "MC_PLAN_INCOMPLETE"
      fi

  # ── MODE A: DECOMPOSE NEXT MILESTONE (bounded continuation loop) ────────────
  # Entered only when the router says the draft is incomplete. Each iteration
  # inspects partial specs/implementation/** state and prior artifacts, then
  # CONTINUES (never regenerates) correct completed sections; the trailing
  # re-check refreshes the guard input. Completion is decided SOLELY by the
  # deterministic validator + rationale existence in until_bash — never by an
  # agent promise. The `until` sentinel below must NEVER be emitted by an agent.
  - id: plan-milestone
    depends_on: [mc-plan-status]
    when: "$mc-plan-status.output == 'MC_PLAN_INCOMPLETE'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: MC_PLAN_LOOP_TEXT_SIGNAL_NEVER_EMIT_7c31ab
      until_bash: |
        set -euo pipefail
        node scripts/automation/milestone-validate.mjs --expect-next > /dev/null
        test -s "$ARTIFACTS_DIR/milestone-plan-rationale.md"
      nodes:
        - id: plan-iterate
          command: foresift-mc-plan
          effort: high
          idle_timeout: 1800000
        - id: plan-recheck
          depends_on: [plan-iterate]   # siblings without an edge run concurrently
          bash: |
            set +e
            node scripts/automation/milestone-validate.mjs --expect-next \
              > "$ARTIFACTS_DIR/plan-completeness.json" 2>&1
            echo "PLAN_RECHECK_EXIT=$?"

  # ── MODE A: INDEPENDENT PLANNING REVIEW ─────────────────────────────────────
  # Ordered strictly after the planning loop via the plan-milestone edge; the
  # mc-plan-status edge guarantees ≥1 success even when the loop was legitimately
  # skipped (draft already complete at entry). A FAILED loop (exhaustion) keeps
  # this node skipped via none_failed_min_one_success — recovery belongs to the
  # supervisor, never to a review of a broken draft.
  - id: plan-review
    command: foresift-mc-plan-review
    depends_on: [mc-plan-status, plan-milestone]
    trigger_rule: none_failed_min_one_success
    context: fresh
    idle_timeout: 1800000

  # Apply CRITICAL/HIGH review findings to the draft plan (max 2 repair passes,
  # independent fresh-context judge per pass).
  - id: plan-fix-loop
    depends_on: [plan-review]
    idle_timeout: 1800000
    loop_group:
      max_iterations: 2
      fresh_context: true
      until: PLAN_READY
      nodes:
        - id: plan-fix
          command: foresift-mc-plan-fix
          effort: high
        - id: plan-judge
          prompt: |
            You are reviewing a Foresift milestone decomposition plan for final
            readiness. The draft lives at specs/implementation/current-milestone.json;
            the independent reviewer's findings and the planner's response are:

            Reviewer findings:
            $plan-review.output

            Planner response (most recent repair pass):
            $LOOP_PREV.plan-fix.output

            Verify every CRITICAL/HIGH finding was addressed and the plan still
            covers its milestone's requirements exactly once. If ready for
            deterministic validation end with EXACTLY:
            <promise>PLAN_READY</promise>
            Otherwise list remaining problems and end with EXACTLY:
            <promise>PLAN_NOT_READY</promise>
          depends_on: [plan-fix]
          model: large
          allowed_tools: [Read, Glob, Grep]

  # ── MODE A ROUTER: deterministic plan-validation status ─────────────────────
  # Captured, non-failing check that routes around the validation repair loop.
  - id: validate-status
    depends_on: [plan-fix-loop]
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/milestone-validate.mjs --expect-next \
        > "$ARTIFACTS_DIR/plan-validate-report.json" 2>&1
      if [ $? -eq 0 ] && [ -s "$ARTIFACTS_DIR/milestone-plan-rationale.md" ]; then
        echo "PLAN_VALID"
      else
        echo "PLAN_INVALID"
        cat "$ARTIFACTS_DIR/plan-validate-report.json"
      fi

  # ── DETERMINISTIC PLAN VALIDATION REPAIR LOOP ────────────────────────────────
  # The milestone validator is the sole completion authority. Entered only when
  # the router reports PLAN_INVALID; each iteration applies exactly the reported
  # errors (unconditional body) then re-validates (trailing re-check), while
  # until_bash re-checks authoritatively. Validation failure can never strand
  # the stage: the repair path stays open until the guard passes or iterations
  # exhaust into supervisor recovery.
  - id: plan-validate
    depends_on: [validate-status]
    when: "$validate-status.output == 'PLAN_INVALID'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: MC_VALIDATE_LOOP_TEXT_SIGNAL_NEVER_EMIT_2e96d4
      until_bash: |
        set -euo pipefail
        node scripts/automation/milestone-validate.mjs --expect-next > /dev/null
        test -s "$ARTIFACTS_DIR/milestone-plan-rationale.md"
      nodes:
        - id: plan-validate-fix
          command: foresift-mc-plan-validate-fix
          effort: high
          idle_timeout: 1800000
        - id: validate-recheck
          depends_on: [plan-validate-fix]   # siblings without an edge run concurrently
          bash: |
            set +e
            node scripts/automation/milestone-validate.mjs --expect-next \
              > "$ARTIFACTS_DIR/plan-validate-report.json" 2>&1
            echo "VALIDATE_RECHECK_EXIT=$?"

  # ── MODE B: INDEPENDENT MILESTONE AUDIT (bounded continuation loops) ────────
  - id: verify-repo
    bash: |
      set -euo pipefail
      pnpm foresift:gate -- --milestone
      # Deterministically seed the durable audit-progress artifact before any
      # auditor iteration runs (scope computed from the authoritative manifest).
      node scripts/automation/audit-progress.mjs --init
    depends_on: [mode-select]
    when: "$mode-select.output.mode == 'AUDIT' || $mode-select.output.mode == 'AUDIT_FINAL'"
    timeout: 1800000

  # Ordinary milestone audit: bounded fresh-context loop over the durable
  # progress artifact; each turn audits the next unaudited requirement range.
  - id: audit-loop
    depends_on: [verify-repo]
    when: "$mode-select.output.mode == 'AUDIT'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 8
      fresh_context: true
      until: MC_AUDIT_LOOP_TEXT_SIGNAL_NEVER_EMIT_d92f50
      until_bash: |
        set -euo pipefail
        node scripts/automation/audit-progress.mjs --check > /dev/null
      nodes:
        - id: audit-iterate
          command: foresift-mc-audit
          effort: high
          idle_timeout: 1800000

  # FINAL product-wide audit (G7): every requirement in the authoritative
  # manifest must carry an audited, evidenced verdict before the loop ends.
  - id: final-audit-loop
    depends_on: [verify-repo]
    when: "$mode-select.output.mode == 'AUDIT_FINAL'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 16
      fresh_context: true
      until: MC_AUDIT_FINAL_LOOP_TEXT_SIGNAL_NEVER_EMIT_a51c33
      until_bash: |
        set -euo pipefail
        node scripts/automation/audit-progress.mjs --check > /dev/null
      nodes:
        - id: audit-iterate-final
          command: foresift-mc-audit
          effort: high
          idle_timeout: 1800000

  # One-shot verdict execution after full audit coverage (never inside the
  # loop): gaps → remediation packages appended to the SAME milestone;
  # pass → archive to history/ (final: FINAL-AUDIT.md + product-wide record).
  - id: audit-conclude
    command: foresift-mc-audit-conclude
    depends_on: [audit-loop, final-audit-loop]
    trigger_rule: none_failed_min_one_success
    context: fresh
    idle_timeout: 1800000
    effort: high

  # ── SHARED LANDING: branch, commit, PR, exact-head CI, merge ────────────────
  # Reaches here from EITHER mode: PLAN via the validation path, AUDIT via the
  # audit path. validate-status (always completing in PLAN) plus audit-conclude
  # (always completing in AUDIT) guarantee ≥1 non-failed success on the healthy
  # path of each mode; any upstream FAILURE keeps this node skipped so the
  # supervisor recovers instead of landing a broken state.
  - id: land-planning-pr
    command: foresift-mc-land
    depends_on: [validate-status, plan-validate, audit-conclude]
    trigger_rule: none_failed_min_one_success
    context: fresh
    idle_timeout: 1800000
