name: foresift-sharded-wave
description: |
  ONE parallel implementation wave for a work package (implementation-
  acceleration override §8/§28): deterministic task graph + write-disjoint
  shard plan -> concurrent HIGH-effort writer lanes (serial core + parallel
  shards), each in its OWN git worktree at the same pinned base HEAD ->
  deterministic write-authority guards -> additive streaming-style
  integration into the canonical branch -> ONE TRUE combined package FAST
  (wp:fast-verify — impact-aware, fail-closed, never the FULL gate) whose RED
  verdict provably fails the wave path: a bounded targeted-repair loop must
  converge to a green recheck or the run ends failed, and the durable
  checkpoint is written ONLY on the green path. Empty lanes are `when`-gated
  OFF before any provider dispatch — zero executable units invoke zero AI.
  Canonical bookkeeping (tasks.md, checkpoints) is coordinator-only; writers
  never touch it (override §7). Repeat invocations run further waves; the
  authoritative FULL gate stays downstream in the standard package flow
  (override §18).

  Continuation law (planning handoff): archon starts run worktrees FRESH AT
  MAIN's tip, so a package whose implementation baseline lives on its pushed
  package branch would be re-implemented from main. The `branch-adoption`
  node deterministically adopts the launched branch tip (absorbing current
  origin/main first when stale) BEFORE the base is pinned — zero AI.
tags: [foresift, throughput, parallel]

provider: claude
effort: high

nodes:
  # ── ADOPTION: continue from the launched package branch when it exists ──────
  # Deterministic, zero-AI (wave-branch-adoption.mjs). No pushed launch
  # branch ⇒ FRESH_FROM_MAIN no-op — the historical fresh-package shape is
  # byte-identical. A pushed branch ⇒ adopted as the integration base so
  # only REMAINING tasks execute on top of durable prior work. Fail-closed:
  # dirty tree, unverifiable refs, merge conflict, or push failure refuse
  # before any provider spend; supervisor recovery replays cleanly.
  - id: branch-adoption
    bash: |
      set -euo pipefail
      node scripts/automation/wave-branch-adoption.mjs --message "$ARGUMENTS" 2>&1 |
        tee "$ARTIFACTS_DIR/branch-adoption.json"
    timeout: 120000

  # ── PREP: task graph, shard plan, briefs, private worktrees ──────────────────
  - id: prep
    depends_on: [branch-adoption]
    bash: |
      set -euo pipefail
      PKG="${ARGUMENTS%%@g*}"
      BASE="$(git rev-parse HEAD)"
      printf '%s' "$BASE" > "$ARTIFACTS_DIR/base-head.txt"
      node scripts/automation/build-implementation-task-graph.mjs \
        --package "$PKG" --plan-shards "${FORESIFT_WRITERS:-3}" \
        --out "$ARTIFACTS_DIR/task-graph.json"
      node scripts/automation/build-plan-context.mjs --package "$PKG" \
        --out "$ARTIFACTS_DIR" || true
      node scripts/automation/build-writer-briefs.mjs --package "$PKG" \
        --graph "$ARTIFACTS_DIR/task-graph.json" \
        --capsule "$ARTIFACTS_DIR/plan-capsule.json" \
        --out "$ARTIFACTS_DIR/briefs" \
        --writer-root "$ARTIFACTS_DIR/wt" --base-head "$BASE"
      # Hybrid engine routing (V4 §25/§30): writes engine-<lane>.txt containing
      # either the exact empty-lane sentinel, 'CLAUDE' (default), or 'AGY'
      # (opt-in via FORESIFT_AGY_LANES AND a runnable agy binary; core lane
      # never routes AGY). Pure deterministic decision — no AI dispatch here.
      node scripts/automation/exec-agy-writer.mjs --emit-engine-files \
        "$ARTIFACTS_DIR/task-graph.json" "$ARTIFACTS_DIR"
      node scripts/automation/check-writer-admission.mjs \
        > "$ARTIFACTS_DIR/admission.json" || true
      # Private worktree + branch per shard, all at the SAME pinned base.
      node -e '
        const fs = require("node:fs");
        const { spawnSync } = require("node:child_process");
        const dir = process.env.ARTIFACTS_DIR;
        const g = JSON.parse(fs.readFileSync(dir + "/task-graph.json", "utf8"));
        const base = fs.readFileSync(dir + "/base-head.txt", "utf8").trim();
        const meta = {};
        for (const s of g.shards ?? []) {
          const wt = dir + "/wt/" + s.id;
          const br = "foresift/wave/" + base.slice(0,10) + "-" + s.id;
          const r = spawnSync("git worktree add -B \"" + br + "\" \"" + wt + "\" \"" + base + "\"",
            { shell: true });
          if (r.status !== 0) throw new Error("worktree add failed for " + s.id + ": " + r.stderr);
          meta[s.id] = { branch: br, worktree: wt };
        }
        fs.writeFileSync(dir + "/shard-meta.json", JSON.stringify(meta, null, 2));
        console.log("SHARDS_READY " + Object.keys(meta).join(","));
      '
      cat "$ARTIFACTS_DIR/shard-meta.json"

  # Per-shard brief emitters: prompt interpolation reads sibling outputs, so
  # each writer gets ONLY its own brief. When a lane has no assigned units the
  # emitter prints exactly its deterministic sentinel; the writer/guard nodes
  # below are `when`-gated on that sentinel so an EMPTY LANE NEVER DISPATCHES
  # A PROVIDER (zero executable units → zero AI invocations). The exact-match
  # sentinel pattern is the same proven gating style as $gate-router.output in
  # the optimized package flow (archon v0.9 condition evaluator supports ==/!=).
  - id: brief-core
    depends_on: [prep]
    bash: cat "$ARTIFACTS_DIR/briefs/core-brief.md" 2>/dev/null || echo "NO CORE SHARD THIS WAVE"
  - id: brief-shard-1
    depends_on: [prep]
    bash: cat "$ARTIFACTS_DIR/briefs/shard-1-brief.md" 2>/dev/null || echo "NO SHARD-1 THIS WAVE"
  - id: brief-shard-2
    depends_on: [prep]
    bash: cat "$ARTIFACTS_DIR/briefs/shard-2-brief.md" 2>/dev/null || echo "NO SHARD-2 THIS WAVE"

  # Per-lane ENGINE emitters (V4 §30): content is the empty-lane sentinel
  # itself when the lane has no shard (so BOTH engine variants stay OFF — the
  # zero-AI invariant survives the hybrid split), else 'CLAUDE' or 'AGY'.
  - id: exec-shard-1
    depends_on: [prep]
    bash: cat "$ARTIFACTS_DIR/engine-shard-1.txt" 2>/dev/null || echo "CLAUDE"
  - id: exec-shard-2
    depends_on: [prep]
    bash: cat "$ARTIFACTS_DIR/engine-shard-2.txt" 2>/dev/null || echo "CLAUDE"

  # ── WRITER LANES (siblings without edges run CONCURRENTLY — proven R3) ───────
  # Each lane is skipped entirely when its brief is absent (empty-lane zero-AI);
  # Defect #10 policy: explicit on_error: all so silent provider empty-streams
  # (UNKNOWN class) are retried instead of silently killing the lane. Strong
  # retry layers stay intact: this node-level retry (L1/L2) plus autopilot
  # recovery (L3) downstream.
  - id: writer-core
    depends_on: [brief-core]
    when: "$brief-core.output != 'NO CORE SHARD THIS WAVE'"
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: all
    effort: high
    idle_timeout: 2700000
    prompt: |
      You are a Foresift parallel IMPLEMENTATION WRITER for lane "core"
      (package "${ARGUMENTS%%@g*}"). Your complete assignment is below. Implement
      it INSIDE YOUR PRIVATE WORKTREE named in the brief — never the checkout you
      were started in. Commit coherent slices there as you go (signed-off style:
      plain commits). Run ONLY targeted tests named in your brief or directly
      affected suites; NEVER pnpm verify / FULL gates / repository-wide runs
      (override §14). Never edit specs/<pkg>/tasks.md, checkpoints, or anything
      outside your allowed write paths. When finished, write your result manifest
      to $ARTIFACTS_DIR/writer-results/core/result.json (see completion contract
      in the brief).

      ===== WRITER BRIEF =====
      $brief-core.output

  - id: writer-shard-1
    depends_on: [brief-shard-1, exec-shard-1]
    when: "$exec-shard-1.output == 'CLAUDE'"
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: all
    effort: high
    idle_timeout: 2700000
    prompt: |
      You are a Foresift parallel IMPLEMENTATION WRITER for lane "shard-1"
      (package "${ARGUMENTS%%@g*}"). Your complete assignment is below. Implement
      it INSIDE YOUR PRIVATE WORKTREE named in the brief — never the checkout you
      were started in. Commit coherent slices there as you go. Run ONLY targeted
      tests named in your brief or directly affected suites; NEVER pnpm verify /
      FULL gates / repository-wide runs. Never edit specs/<pkg>/tasks.md,
      checkpoints, or anything outside your allowed write paths. When finished,
      write your result manifest to $ARTIFACTS_DIR/writer-results/shard-1/
      result.json (see completion contract in the brief).

      ===== WRITER BRIEF =====
      $brief-shard-1.output

  - id: writer-shard-2
    depends_on: [brief-shard-2, exec-shard-2]
    when: "$exec-shard-2.output == 'CLAUDE'"
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: all
    effort: high
    idle_timeout: 2700000
    prompt: |
      You are a Foresift parallel IMPLEMENTATION WRITER for lane "shard-2"
      (package "${ARGUMENTS%%@g*}"). Your complete assignment is below. Implement
      it INSIDE YOUR PRIVATE WORKTREE named in the brief — never the checkout you
      were started in. Commit coherent slices there as you go. Run ONLY targeted
      tests named in your brief or directly affected suites; NEVER pnpm verify /
      FULL gates / repository-wide runs. Never edit specs/<pkg>/tasks.md,
      checkpoints, or anything outside your allowed write paths. When finished,
      write your result manifest to $ARTIFACTS_DIR/writer-results/shard-2/
      result.json (see completion contract in the brief).

      ===== WRITER BRIEF =====
      $brief-shard-2.output

  # ── HYBRID VARIANTS (V4 §25/§30): Antigravity execution for parallel lanes ───
  # Opt-in and fail-closed: prep's pure decision routes a lane here ONLY when
  # FORESIFT_AGY_LANES names it AND the `agy` binary is runnable; otherwise the
  # CLAUDE command lane runs exactly as proven. Same brief, same private
  # worktree, same write-authority guard + additive integration downstream —
  # the engine differs, the authority boundary does not. Retry follows the
  # defect-#10 policy; the executor enforces the writer-result contract itself.
  - id: writer-shard-1-agy
    depends_on: [exec-shard-1]
    when: "$exec-shard-1.output == 'AGY'"
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: all
    timeout: 3600000
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR/writer-results/shard-1"
      node scripts/automation/exec-agy-writer.mjs \
        --lane shard-1 \
        --brief "$ARTIFACTS_DIR/briefs/shard-1-brief.md" \
        --worktree "$ARTIFACTS_DIR/wt/shard-1" \
        --results-dir "$ARTIFACTS_DIR/writer-results/shard-1"

  - id: writer-shard-2-agy
    depends_on: [exec-shard-2]
    when: "$exec-shard-2.output == 'AGY'"
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: all
    timeout: 3600000
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR/writer-results/shard-2"
      node scripts/automation/exec-agy-writer.mjs \
        --lane shard-2 \
        --brief "$ARTIFACTS_DIR/briefs/shard-2-brief.md" \
        --worktree "$ARTIFACTS_DIR/wt/shard-2" \
        --results-dir "$ARTIFACTS_DIR/writer-results/shard-2"

  # ── GUARDS: deterministic write-authority enforcement (override §9) ──────────
  # One guard per lane; each recomputes the actual diff against the pinned base
  # and enforces allowedWritePaths ⊆ scopes. It OVERWRITES result.json with
  # computed facts (branch/head/base) so the integrator never trusts claims.
  #
  # Bridge shape (v0.9 semantics): the always-completing brief parent keeps
  # `none_failed_min_one_success` satisfiable so the guard runs whenever its
  # writer was SKIPPED-empty OR succeeded, and stays BLOCKED when the writer
  # genuinely FAILED (a failed lane must surface, not vanish). The identical
  # `when` gate keeps truly-empty lanes from executing any guard logic at all.
  - id: guard-core
    depends_on: [brief-core, writer-core]
    trigger_rule: none_failed_min_one_success
    when: "$brief-core.output != 'NO CORE SHARD THIS WAVE'"
    bash: |
      set -euo pipefail
      node scripts/automation/wave-guard.mjs --shard core \
        --artifacts "$ARTIFACTS_DIR" --graph "$ARTIFACTS_DIR/task-graph.json"
  - id: guard-shard-1
    depends_on: [brief-shard-1, writer-shard-1, writer-shard-1-agy]
    trigger_rule: none_failed_min_one_success
    when: "$brief-shard-1.output != 'NO SHARD-1 THIS WAVE'"
    bash: |
      set -euo pipefail
      node scripts/automation/wave-guard.mjs --shard shard-1 \
        --artifacts "$ARTIFACTS_DIR" --graph "$ARTIFACTS_DIR/task-graph.json"
  - id: guard-shard-2
    depends_on: [brief-shard-2, writer-shard-2, writer-shard-2-agy]
    trigger_rule: none_failed_min_one_success
    when: "$brief-shard-2.output != 'NO SHARD-2 THIS WAVE'"
    bash: |
      set -euo pipefail
      node scripts/automation/wave-guard.mjs --shard shard-2 \
        --artifacts "$ARTIFACTS_DIR" --graph "$ARTIFACTS_DIR/task-graph.json"

  # ── INTEGRATE + ONE TRUE COMBINED FAST (serial join, override §16/§17) ───────
  # Integration is additive and skip-closed per lane: a rejected shard never
  # corrupts the canonical branch (its evidence stays in the report for the
  # supervisor). Then the wave runs the ACTUAL FAST tier — wp:fast-verify
  # (package-fast-verify.mjs): impact-aware, fail-closed on unknown scope,
  # non-attesting, non-merge-authorizing — NEVER the FULL gate, and NEVER per
  # writer. This node ALWAYS COMPLETES and acts as the deterministic router:
  # it echoes WAVE_FAST_GREEN / WAVE_FAST_RED from the FAST exit code. RED does
  # NOT end here silently — it opens the bounded repair loop below, and the
  # checkpoint fires only through the green path (wave-settled bridge), so no
  # false green and no checkpoint after red (override §14/§15 acceptance).
  - id: integrate-and-fast
    depends_on: [guard-core, guard-shard-1, guard-shard-2]
    trigger_rule: none_failed_min_one_success   # guards fail closed per-lane
    timeout: 3600000
    bash: |
      set -uo pipefail
      PKG="${ARGUMENTS%%@g*}"
      # STDOUT DISCIPLINE (canary run B, defect #14): this node's stdout must
      # be EXACTLY one verdict line — the repair loop's when-gate compares the
      # captured router output to 'WAVE_FAST_RED', so ANY extra stdout (report
      # dumps, log tails) makes that comparison never match and silently
      # disables RED handling. The V3 gate-router idiom is authoritative:
      # diagnostics go to FILES.
      #
      # Real integrator breakage (unreadable graph/results dir) propagates;
      # per-lane REJECTION is a normal outcome recorded in the report.
      node scripts/automation/integrate-writer-results.mjs --package "$PKG" \
        --graph "$ARTIFACTS_DIR/task-graph.json" \
        --results-dir "$ARTIFACTS_DIR/writer-results" \
        --canonical . \
        --out "$ARTIFACTS_DIR/integration-report.json"
      # Defect #12 guard: a wave that DISPATCHED writer lanes but integrated
      # NONE of them made zero progress and must not ride a green FAST verdict
      # (its diff-vs-base is empty, so FAST would pass vacuously). Only a truly
      # empty wave (every lane sentinel-skipped — no result.json anywhere) or a
      # wave with ≥1 integrated lane proceeds to the FAST verdict.
      dispatched=$(find "$ARTIFACTS_DIR/writer-results" -name result.json 2>/dev/null | wc -l)
      integrated=$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log((r.integrated??[]).length)' "$ARTIFACTS_DIR/integration-report.json")
      if [ "$dispatched" -gt 0 ] && [ "$integrated" -eq 0 ]; then
        echo "wave integration empty: $dispatched dispatched lane(s), none integrated; full report: $ARTIFACTS_DIR/integration-report.json" \
          > "$ARTIFACTS_DIR/wave-integration-empty.log" 2>&1
        printf '{"schema":"foresift/wave-fast-verdict@1","exitCode":90,"reason":"integration_empty"}\n' \
          > "$ARTIFACTS_DIR/wave-fast-verdict.json"
        echo "WAVE_FAST_RED"
        exit 0
      fi
      # ONE TRUE combined package FAST for the whole integrated wave.
      set +e
      node scripts/automation/package-fast-verify.mjs --package "$PKG" \
        --artifacts-dir "$ARTIFACTS_DIR" \
        --from-git --base "$(cat "$ARTIFACTS_DIR/base-head.txt")" \
        > "$ARTIFACTS_DIR/wave-fast.log" 2>&1
      code=$?
      printf '{"schema":"foresift/wave-fast-verdict@1","exitCode":%d}\n' "$code" \
        > "$ARTIFACTS_DIR/wave-fast-verdict.json"
      if [ "$code" -eq 0 ]; then
        echo "WAVE_FAST_GREEN"
      else
        echo "WAVE_FAST_RED"
      fi

  # ── FAST RED: BOUNDED TARGETED REPAIR (override §14 — red really fails) ─────
  # Runs ONLY on WAVE_FAST_RED. Each iteration performs TARGETED semantic
  # repair against the structured FAST manifest (never a full rerun), then the
  # loop guard RE-RUNS THE ACTUAL FAST as the recheck — the loop can only exit
  # via a genuinely green recheck (wave-fast-verdict.json is rewritten by that
  # very invocation). Exhausted iterations with a still-red recheck FAIL the
  # node: downstream settles blocked, the workflow completes failed, and NO
  # checkpoint is written. Repair retries follow the defect-#10 policy.
  #
  # Live finding 2026-08-26 (run b101f6c3): the full-tier recheck used to run
  # INSIDE this guard, but a bare until_bash execution gets a short default
  # wall budget (~3 min observed) — an escalated FULL-suite recheck (~14 min)
  # was killed mid-run every iteration and the loop exhausted deterministically.
  # Same shape as gate-repair-loop in foresift-work-package.yaml: the heavy
  # verification is a serialized NODE with an explicit timeout that refreshes
  # wave-fast-verdict.json; this guard stays a sub-second verdict read fed by
  # archon's bare-form $ARTIFACTS_DIR textual substitution (process.env is NOT
  # exported into until_bash — probe-verified contract, ADR-0004 family).
  - id: fast-repair-loop
    depends_on: [integrate-and-fast]
    when: "$integrate-and-fast.output == 'WAVE_FAST_RED'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 3
      fresh_context: true
      until: WAVE_REPAIR_LOOP_TEXT_SIGNAL_NEVER_EMIT_c5f19a
      until_bash: |
        set -uo pipefail
        # CHEAP convergence read — exit 0 is the only key out of the repair
        # loop, and the verdict is the ACTUAL FAST tier's exit code (produced
        # by the fast-recheck node below), never a heuristic. Defect #12 hold:
        # an empty-integration wave keeps code=90 in the verdict so it can
        # never convert its own RED into a green exit.
        node -e 'const fs=require("fs");const f=process.argv[1]+"/wave-fast-verdict.json";if(!fs.existsSync(f))process.exit(1);const r=JSON.parse(fs.readFileSync(f,"utf8"));process.exit(r.exitCode===0?0:1)' "$ARTIFACTS_DIR"
      nodes:
        - id: fast-repair
          command: foresift-wave-fast-repair
          retry:
            max_attempts: 3
            delay_ms: 10000
            on_error: all
          effort: high
          idle_timeout: 1800000
        - id: fast-recheck
          depends_on: [fast-repair]   # serialize: recheck observes post-repair state (feeds guard)
          bash: |
            set +e
            # Recheck = the ACTUAL FAST tier again (not a heuristic). Verdict
            # JSON refreshed every pass for the loop guard above. Defect #12:
            # while lanes were dispatched but NONE integrated, the diff-vs-
            # base is empty and FAST would pass vacuously — hold closed
            # (code=90) so an empty-integration wave can never convert its own
            # RED into a green exit. Exhaustion then fails the node loudly.
            dispatched=$(find "$ARTIFACTS_DIR/writer-results" -name result.json 2>/dev/null | wc -l)
            integrated=$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log((r.integrated??[]).length)' "$ARTIFACTS_DIR/integration-report.json")
            if [ "$dispatched" -gt 0 ] && [ "$integrated" -eq 0 ]; then
              code=90
              echo "recheck held: integration still empty ($dispatched dispatched, none integrated)"
            else
              node scripts/automation/package-fast-verify.mjs --package "${ARGUMENTS%%@g*}" \
                --artifacts-dir "$ARTIFACTS_DIR" \
                --from-git --base "$(cat "$ARTIFACTS_DIR/base-head.txt")" \
                > "$ARTIFACTS_DIR/wave-fast-recheck.log" 2>&1
              code=$?
            fi
            printf '{"schema":"foresift/wave-fast-verdict@1","exitCode":%d,"phase":"recheck"}\n' "$code" \
              > "$ARTIFACTS_DIR/wave-fast-verdict.json"
            tail -n 20 "$ARTIFACTS_DIR/wave-fast-recheck.log" 2>/dev/null || true
            if [ "$code" -ne 0 ]; then echo "WAVE_FAST_STILL_RED"; else echo "WAVE_FAST_GREEN"; fi
          timeout: 3600000

  # ── GREEN PATH BRIDGE + DURABLE CHECKPOINT (override §18 item 15) ────────────
  # wave-settled runs iff the wave reached a genuinely green FAST state: either
  # integrate-and-fast reported WAVE_FAST_GREEN directly (repair loop legally
  # skipped) or the repair loop converged to a green recheck. It stays BLOCKED
  # while repair is still failing — the failure surfaces to the supervisor's
  # recovery instead of a false-settled wave. Only then is the implementation
  # checkpoint built (coordinator-only bookkeeping), pinning post-wave HEAD,
  # completed units, and the FAST outcome for the next turn/wave.
  - id: wave-settled
    depends_on: [integrate-and-fast, fast-repair-loop]
    trigger_rule: none_failed_min_one_success   # blocks iff repair genuinely FAILED
    bash: |
      echo "WAVE_PHASE_SETTLED"
  - id: wave-checkpoint
    depends_on: [wave-settled]
    bash: |
      set -euo pipefail
      PKG="${ARGUMENTS%%@g*}"
      UNITS="$(node -e '
        const fs = require("node:fs");
        try {
          const r = JSON.parse(fs.readFileSync(process.argv[1] + "/integration-report.json", "utf8"));
          console.log([...new Set((r.integrated ?? []).flatMap((x) => x.units ?? []))].join(","));
        } catch { console.log(""); }
      ' "$ARTIFACTS_DIR")"
      CHECK_ARGS=""
      if [ -n "$UNITS" ]; then CHECK_ARGS="--slice-tasks $UNITS"; fi
      node scripts/automation/package-checkpoint.mjs --build --package "$PKG" \
        --artifacts-dir "$ARTIFACTS_DIR" \
        --slice-id "wave-$(git rev-parse --short HEAD)" \
        $CHECK_ARGS \
        --checks '[{"command":"wp:fast-verify","result":"PASS"}]'
