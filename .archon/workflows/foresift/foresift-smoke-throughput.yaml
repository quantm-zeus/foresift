name: foresift-smoke-throughput
description: |
  Deterministic Foresift THROUGHPUT-CONTROL smoke test — no AI, no provider
  spend, no product code. Proves, inside the REAL Archon v0.9 runtime, that the
  throughput control-plane tools behave exactly as ADR 0006 claims:

    1. regular bash nodes receive ARTIFACTS_DIR as a real env var and can
       drive the durable checkpoint tool (build -> validate = valid);
    2. an until_bash guard FAILS while a cached source file's hash is stale
       and PASSES once reality matches again — i.e. hash invalidation actually
       drives loop iteration (tamper -> auto-iteration -> repair -> pass);
    3. the FULL-gate --check mode FAILS CLOSED when no attestation exists;
    4. the dedupe classifier runs and reports UNIQUE_MANDATORY for unprovable
       commands (fail-closed direction);
    5. the V2 slice-finalization ORDER contract holds in-runtime: a checkpoint
       built LAST (after the tasks.md edit + commit) validates cleanly at the
       next turn, while building BEFORE a tasks.md edit self-invalidates;
    6. TARGETED verification routes a single-category failure to exactly its
       own check and escalates ambiguous evidence fail-closed (exit 3);
    7. the convergence router fails closed to CONVERGENCE_REQUIRED on absent
       evidence and skips ONLY when every condition provably holds;
    8. a REAL red package gate writes a structured manifest that the targeted
       executor consumes end-to-end (re-running the exact recorded command);
    9. deterministic PR composition (package-create-pr.mjs --dry-run) derives
       title/body from milestone metadata + gate evidence with zero AI and
       zero persistence.

  Run after any change to the throughput control plane or any Archon upgrade:

    rm -rf /tmp/foresift-smoke-throughput
    archon workflow run foresift-smoke-throughput --detach --branch foresift/smoke-throughput
    archon workflow get <run-id> --json    # expect status completed

  NOT for: anything product-related.
tags: [foresift, smoke]

nodes:
  - id: init
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      rm -rf "$S"
      mkdir -p "$S/src"
      printf 'authority-v1\n' > "$S/src/tasks.md"
      echo 0 > "$S/iterations"
      echo "smoke-init-ok artifacts-dir=$ARTIFACTS_DIR"

  # ── PROOF 1+2: durable checkpoint lifecycle drives a deterministic loop ────
  # Iteration 1 builds a VALID checkpoint then tampers its source (models
  # reality drifting away from cached context). The guard must REJECT the now
  # stale cache. Iteration 2 restores the source (models rebuilding context
  # from authority) and the same guard must ACCEPT. Two iterations minimum is
  # the proof that hash invalidation — not agent promises — ends the stage.
  - id: checkpoint-loop
    depends_on: [init]
    idle_timeout: 300000
    loop_group:
      max_iterations: 5
      fresh_context: true
      until: THROUGHPUT_LOOP_TEXT_SIGNAL_NEVER_EMIT_9a1c3f
      until_bash: |
        set -euo pipefail
        S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
        node scripts/automation/package-checkpoint.mjs --validate \
          --package g0-smoke-throughput --artifacts-dir "$S" \
          > "$S/guard-last.json"
      nodes:
        - id: iterate
          bash: |
            set -euo pipefail
            S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
            N=$(($(cat "$S/iterations") + 1))
            echo "$N" > "$S/iterations"
            if [ "$N" -eq 1 ]; then
              # Build a checkpoint whose cached context matches reality…
              node scripts/automation/package-checkpoint.mjs --build \
                --package g0-smoke-throughput --artifacts-dir "$S" \
                --head 0000000000000000000000000000000000000000 \
                --source tasks="$S/src/tasks.md" >/dev/null
              node scripts/automation/package-checkpoint.mjs --validate \
                --package g0-smoke-throughput --artifacts-dir "$S" \
                >/dev/null || { echo "checkpoint must be valid right after build"; exit 1; }
              # …then let reality drift: tamper the cached source file.
              printf 'authority-v2-tampered\n' > "$S/src/tasks.md"
              echo "iteration-1-built-checkpoint-then-drifted-reality"
            else
              # A fresh turn rebuilds context from the authoritative source,
              # restoring agreement between cache and reality.
              printf 'authority-v2-tampered\n' > "$S/src/tasks.md"
              node scripts/automation/package-checkpoint.mjs --build \
                --package g0-smoke-throughput --artifacts-dir "$S" \
                --head 0000000000000000000000000000000000000000 \
                --source tasks="$S/src/tasks.md" >/dev/null
              echo "iteration-$N-rebuilt-context-from-authority"
            fi

  - id: verify-checkpoint-loop
    depends_on: [checkpoint-loop]
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      N=$(cat "$S/iterations")
      if [ "${N:-0}" -lt 2 ]; then
        echo "FAIL: expected >=2 iterations (stale cache must NOT satisfy the guard); got ${N:-0}"
        exit 1
      fi
      grep -q '"valid":true' "$S/guard-last.json" || {
        cat "$S/guard-last.json"; echo "FAIL: guard verdict should be valid at loop end"; exit 1;
      }
      echo "PROOF 1+2 OK: checkpoint built, tampered source invalidated it, fresh rebuild restored validity."

  # ── PROOF 3: FULL-gate check fails closed without an attestation ────────────
  - id: verify-full-gate-fail-closed
    depends_on: [verify-checkpoint-loop]
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      if node scripts/automation/package-full-gate.mjs --check \
           --package g0-contracts-data-truth --artifacts-dir "$S/empty" \
           >/dev/null 2>&1; then
        echo "FAIL: --check must reject a MISSING attestation (exit nonzero)"
        exit 1
      fi
      echo "PROOF 3 OK: full-gate --check failed closed with no attestation present."

  # ── PROOF 4: dedupe classifier defaults to UNIQUE for unprovable shapes ─────
  - id: verify-dedupe-fail-closed
    depends_on: [verify-full-gate-fail-closed]
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      node scripts/automation/verify-dedupe.mjs --json > "$S/dedupe-report.json"
      grep -q 'UNIQUE_MANDATORY\|DUPLICATE_COVERED_BY_FULL_SUITE' "$S/dedupe-report.json" || {
        echo "FAIL: classifier produced no verdicts"; exit 1;
      }
      node scripts/automation/verify-dedupe.mjs --repo-root . >/dev/null
      echo "PROOF 4 OK: dedupe classifier executed over the real milestone metadata."

  # ── PROOF 5: V2 slice-finalization ORDER contract (V2 task spec §4) ─────────
  # The checkpoint hashes tasks.md and HEAD, so it must be built LAST at a
  # slice boundary. 5a proves the correct order survives into the next turn;
  # 5b proves the defective order (build → then edit tasks.md) is DETECTED as
  # invalid rather than silently trusted.
  - id: finalize-order-proof
    depends_on: [verify-dedupe-fail-closed]
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      R="$S/finalize-repo"
      rm -rf "$R"
      mkdir -p "$R/specs/pkg" "$R/artifacts"
      git -C "$R" init -q
      git -C "$R" config user.email smoke@foresift.invalid
      git -C "$R" config user.name smoke
      printf -- '- [ ] T001\n' > "$R/specs/pkg/tasks.md"
      git -C "$R" add -A
      git -C "$R" commit -qm base
      # CORRECT V2 order: tasks.md updated BEFORE commit, checkpoint built LAST.
      printf -- '- [x] T001\n' > "$R/specs/pkg/tasks.md"
      git -C "$R" add -A
      git -C "$R" commit -qm slice-1
      node scripts/automation/package-checkpoint.mjs --build \
        --package pkg --artifacts-dir "$R/artifacts" --repo-root "$R" >/dev/null
      HEAD1=$(git -C "$R" rev-parse HEAD)
      node scripts/automation/package-checkpoint.mjs --validate \
        --package pkg --artifacts-dir "$R/artifacts" --head "$HEAD1" >/dev/null
      echo "PROOF 5a OK: checkpoint built LAST validates cleanly for the next turn."
      # DEFECTIVE order: build first, THEN mark completion ⇒ must be invalid.
      printf -- '- [ ] T001\n' > "$R/specs/pkg/tasks.md"
      git -C "$R" add -A
      git -C "$R" commit -qm slice-2-start
      node scripts/automation/package-checkpoint.mjs --build \
        --package pkg --artifacts-dir "$R/artifacts" --repo-root "$R" >/dev/null
      printf -- '- [x] T001\n' > "$R/specs/pkg/tasks.md"
      if node scripts/automation/package-checkpoint.mjs --validate \
            --package pkg --artifacts-dir "$R/artifacts" \
            --head "$(git -C "$R" rev-parse HEAD)" >/dev/null 2>&1; then
        echo "FAIL: checkpoint built before a tasks.md edit must NOT validate"
        exit 1
      fi
      echo "PROOF 5b OK: post-build tasks.md drift invalidates the stale cache."

  # ── PROOF 6: TARGETED verification routes and escalates (V2 task spec §10) ──
  # 6a: a single-category TYPECHECK failure plans EXACTLY `pnpm typecheck` and
  #     the executor records a green verdict (exit 0).
  # 6b: ambiguous evidence (two failed categories) escalates fail-closed with
  #     exit 3 WITHOUT executing anything.
  - id: targeted-verify-proof
    depends_on: [finalize-order-proof]
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      T="$S/targeted"; mkdir -p "$T/green" "$T/red"
      node -e '
        const fs=require("fs");
        const m=(checks,extra={})=>JSON.stringify({schema:"foresift/full-gate-result@1",packageId:"p",passed:false,exitCode:1,failedCategories:[],checks,timestamp:new Date().toISOString(),...extra});
        fs.writeFileSync(process.argv[1],m([{label:"TypeScript",category:"TYPECHECK",command:"pnpm typecheck",status:"FAIL"},{label:"tests",category:"TESTS",command:"pnpm test",status:"PASS"}]));
        fs.writeFileSync(process.argv[2],m([{label:"lint",category:"LINT",command:"pnpm lint",status:"FAIL"},{label:"tests",category:"TESTS",command:"pnpm test",status:"FAIL"}]));
      ' "$T/green/full-gate-result.json" "$T/red/full-gate-result.json"
      node scripts/automation/package-targeted-verify.mjs \
        --manifest "$T/green/full-gate-result.json" --artifacts-dir "$T/green" >/dev/null
      node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.mode!=="TARGETED"||r.allGreen!==true||r.checks.length!==1||r.checks[0].command!=="pnpm typecheck")process.exit(1)' "$T/green/targeted-verify-result.json"
      echo "PROOF 6a OK: single-category failure re-verified by exactly its own check."
      set +e
      node scripts/automation/package-targeted-verify.mjs \
        --manifest "$T/red/full-gate-result.json" --artifacts-dir "$T/red" >/dev/null 2>&1
      code=$?
      set -e
      if [ "$code" -ne 3 ]; then echo "FAIL: ambiguous evidence must escalate with exit 3; got $code"; exit 1; fi
      node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.mode!=="ESCALATE_FULL"||r.checks.length!==0)process.exit(1)' "$T/red/targeted-verify-result.json"
      echo "PROOF 6b OK: multi-category ambiguity escalates to the FULL gate without execution."

  # ── PROOF 7: convergence router is fail-closed in BOTH directions ────────────
  # 7a (CLI, real runtime): an artifacts dir with NO evidence ⇒ exit 1
  #     CONVERGENCE_REQUIRED (skipping convergence can never happen by default).
  # 7b (decision core): ALL conditions provably satisfied ⇒ CONVERGENCE_NOT_REQUIRED.
  - id: convergence-router-proof
    depends_on: [targeted-verify-proof]
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      R="$S/router"; mkdir -p "$R/empty-evidence"
      set +e
      node scripts/automation/convergence-router.mjs --package g0-tool-core \
        --artifacts-dir "$R/empty-evidence" >/dev/null 2>&1
      code=$?
      set -e
      if [ "$code" -ne 1 ]; then echo "FAIL: missing evidence must yield REQUIRED (exit 1); got $code"; exit 1; fi
      grep -q '"decision": "CONVERGENCE_REQUIRED"' "$R/empty-evidence/convergence-decision.json"
      echo "PROOF 7a OK: router fails closed to CONVERGENCE_REQUIRED on absent evidence."
      node -e '
        import("./scripts/automation/convergence-router.mjs").then((m)=>{
          const head="a".repeat(40);
          const d=m.decideConvergence({
            currentHead:head,
            verdict:{valid:true,reviewDecision:"APPROVED",unresolvedThreads:0,headAtReviewStart:head,headAfterReview:head},
            attestation:{present:true,drift:null},
            completeness:{complete:true},
          });
          if(d.decision!=="CONVERGENCE_NOT_REQUIRED"||d.reasons.length!==0)process.exit(1);
          const bad=m.decideConvergence({currentHead:head,verdict:{valid:true,reviewDecision:"CHANGES_REQUESTED",unresolvedThreads:0,headAtReviewStart:head,headAfterReview:head},attestation:{present:true,drift:null},completeness:{complete:true}});
          if(bad.decision!=="CONVERGENCE_REQUIRED")process.exit(2);
        }).catch(()=>process.exit(3));
      '
      echo "PROOF 7b OK: decision core skips ONLY when every condition holds."

  # ── PROOF 8: REAL failing gate produces a structured manifest inside Archon ──
  # Runs the actual package gate for g0-tool-core (product packages/* absent ⇒
  # deterministic red) and proves the manifest is machine-actionable end-to-end:
  # parseFullGateResult validates it and the targeted executor re-runs the exact
  # recorded command (red again, exit 1). ~15s, zero AI spend.
  - id: real-gate-manifest-proof
    depends_on: [convergence-router-proof]
    timeout: 600000
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      G="$S/realgate"; mkdir -p "$G"
      set +e
      node scripts/automation/foresift-gate.mjs --package g0-tool-core \
        --result-file "$G/full-gate-result.json" >"$G/gate-log.txt" 2>&1
      code=$?
      set -e
      if [ "$code" -eq 0 ]; then echo "FAIL: expected deterministic red for g0-tool-core"; exit 1; fi
      node -e '
        const {parseFullGateResult}=await import("./scripts/automation/package-full-gate.mjs");
        const fs=await import("node:fs");
        const m=parseFullGateResult(fs.readFileSync(process.argv[1],"utf8"));
        if(!m||m.passed!==false||JSON.stringify(m.failedCategories)!==JSON.stringify(["PACKAGE"]))process.exit(1);
        if(!m.checks.some(c=>c.status==="FAIL"&&c.category==="PACKAGE"))process.exit(2);
      ' "$G/full-gate-result.json"
      echo "PROOF 8a OK: real red gate wrote a structured PACKAGE-failure manifest."
      set +e
      node scripts/automation/package-targeted-verify.mjs \
        --manifest "$G/full-gate-result.json" --gate-log "$G/gate-log.txt" \
        --artifacts-dir "$G" >/dev/null 2>&1
      tcode=$?
      set -e
      if [ "$tcode" -ne 1 ]; then echo "FAIL: targeted rerun of a still-red package check must exit 1; got $tcode"; exit 1; fi
      node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.allGreen!==false||r.checks[0].command.indexOf("packages/domain")<0)process.exit(1)' "$G/targeted-verify-result.json"
      echo "PROOF 8b OK: executor re-ran the EXACT recorded package command from the manifest."

  # ── PROOF 9: deterministic PR composition — zero Claude invocations (§13) ───
  # package-create-pr.mjs --dry-run composes the PR title/body from milestone
  # metadata + persisted gate evidence and persists NOTHING (no push, no gh,
  # no .pr-number). Proves the OPTIMIZED create-pr node's tooling end-to-end
  # without network access. ~1s.
  - id: create-pr-dryrun-proof
    depends_on: [real-gate-manifest-proof]
    timeout: 120000
    bash: |
      set -euo pipefail
      S="${SMOKE_DIR:-/tmp/foresift-smoke-throughput}"
      P="$S/createpr"; mkdir -p "$P"
      printf '{"passed":true,"exitCode":0,"failedCategories":[],"checks":[{"label":"t","category":"TESTS","command":"pnpm test","status":"PASS"}],"schema":"foresift/full-gate-result@1","packageId":"g0-tool-core"}\n' \
        >"$P/full-gate-result.json"
      node scripts/automation/package-create-pr.mjs \
        --package g0-tool-core \
        --branch "foresift/g0-tool-core" \
        --artifacts-dir "$P" --dry-run >"$P/dry-run.json"
      node -e '
        const fs=require("node:fs");
        const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
        if(j.dryRun!==true)process.exit(1);
        if(!/^feat\(g0-tool-core\): /.test(j.title))process.exit(2);
        for(const s of ["## Objective","## Requirements","## Deterministic verification evidence","**PASSED**"])if(!j.body.includes(s))process.exit(3);
      ' "$P/dry-run.json"
      if [ -e "$P/.pr-number" ] || [ -e "$P/pr-body.md" ]; then echo "FAIL: dry-run persisted PR state"; exit 1; fi
      echo "PROOF 9 OK: deterministic PR composition, zero AI, zero persistence."
