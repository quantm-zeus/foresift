name: foresift-work-package-optimized
description: |
  OPTIMIZED-profile variant of foresift-work-package (ADR 0006/0007): the SAME
  proven DAG topology with the implement and ci-merge command bodies swapped for
  the throughput lane — bounded slices, durable implementation checkpoints,
  FAST verification between slices, ONE exact-head FULL gate whose attestation
  is reused everywhere, structured gate manifests driving TARGETED repair, a
  deterministic convergence router, and mechanical landing. The supervisor
  selects this workflow ONLY for packages where throughputProfile() == OPTIMIZED
  (every package EXCEPT g0-contracts-data-truth, which keeps the original DAG
  byte-for-byte forever).

  V2 second-pass evidence flow (task spec §8–§12):
    - the initial FULL gate runs ONCE (wp:full-gate --run) and writes BOTH a
      structured per-check manifest (full-gate-result.json) AND — only on PASS —
      an exact-head attestation (full-gate-attestation.json);
    - every later verification point (--check) reuses that attestation while
      the identity (head, lock, authorities, gate code, toolchain) is
      unchanged, so a clean package executes exactly ONE local FULL gate;
    - failed gates are repaired against the structured manifest with TARGETED
      re-verification between edits; the FULL gate re-runs only once the
      targeted checks are green (or evidence was unusable ⇒ escalation);
    - review outcomes are collected deterministically from GitHub's own review
      state (review-verdict.json); a convergence router decides — fail-closed —
      whether the convergence stage must run at all.

  V2 second-pass mechanical landing (task spec §13–§14): the create-PR step and
  the clean final landing path invoke ZERO Claude agents. package-create-pr.mjs
  composes the PR body from milestone metadata + persisted gate evidence and
  discovers-or-creates exactly one PR; package-final-land.mjs re-establishes
  exact-head FULL-gate evidence (attestation reuse first), then hands off to
  the mechanical lander (pinned-head CI wait → squash-merge). The AI command
  foresift-wp-ci-merge-optimized remains ONLY as a bounded fallback routed by
  the final-land-router token, and it must END by re-running the mechanical
  script — never by merging around it.

  Foresift autonomous implementation of exactly ONE work package from the current
  milestone (specs/implementation/current-milestone.json). Invoke as:

    archon workflow run foresift-work-package-optimized --branch foresift/<package-id> "<package-id>"

  ARCHON v0.9.0 LOOP SEMANTICS this layout relies on (verified empirically):
    - every loop iteration runs its FULL body before the guard is evaluated;
    - `when:` inside a loop body CANNOT see same-iteration sibling outputs, so
      conditional AI gating is done by TOP-LEVEL status nodes routing around
      whole loops, and loop bodies run unconditionally (repair -> re-check);
    - loop-body siblings WITHOUT an explicit depends_on edge run CONCURRENTLY,
      so AI->recheck pairs are always serialized with depends_on;
    - prompt interpolation CAN read top-level and same-iteration siblings;
    - until_bash guards get NO ARTIFACTS_DIR environment variable: only
      BARE-FORM `$VAR` references ($ARTIFACTS_DIR/$WORKFLOW_ID/$STATE_DIR/
      $BASE_BRANCH/$DOCS_DIR) are TEXTUALLY SUBSTITUTED into the command
      string before execution — `${ARTIFACTS_DIR}` brace form and env reads
      (process.env.ARTIFACTS_DIR) do NOT work inside guards, while regular
      workflow bash nodes receive ARTIFACTS_DIR as a real env var. Guards
      therefore pass artifact paths as arguments: `--artifacts-dir "$ARTIFACTS_DIR"`.
      This exact gap silently exhausted scoped-plan 4x on 2026-08-22/23 while
      plan-recheck bash nodes exited 0 (ADR 0004).

  NOT for: planning or auditing milestones (use foresift-milestone-control),
  ad-hoc fixes (use archon-assist), or implementing anything outside the
  selected package.

provider: claude
effort: high
tags: [foresift, autonomous]

nodes:
  # ── PHASE 0: DETERMINISTIC PREFLIGHT (fail closed before any AI spend) ─────
  - id: preflight
    bash: |
      set -euo pipefail
      node scripts/automation/preflight.mjs --package "$ARGUMENTS" --branch "$(git rev-parse --abbrev-ref HEAD)"
    timeout: 600000
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: transient

  # ── PHASE 1 ROUTER: deterministic planning-completeness check ───────────────
  - id: plan-status
    depends_on: [preflight]
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/package-plan-complete.mjs --package "$ARGUMENTS" \
        > "$ARTIFACTS_DIR/plan-completeness.json" 2>&1
      if [ $? -eq 0 ]; then echo "WP_PLAN_COMPLETE"; else echo "WP_PLAN_INCOMPLETE"; fi

  # ── PHASE 1: SCOPED SPEC KIT PLANNING (bounded continuation loop) ────────────
  # Runs only when the deterministic router says planning is incomplete. Each
  # iteration inspects existing partial specs/<id>/ and prior artifacts and
  # CONTINUES them (never regenerates correct sections); the re-check refreshes
  # the guard input. Completion is decided solely by the deterministic
  # validator; the `until` sentinel must NEVER be emitted by an agent.
  - id: scoped-plan
    depends_on: [plan-status]
    when: "$plan-status.output == 'WP_PLAN_INCOMPLETE'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: WP_PLAN_LOOP_TEXT_SIGNAL_NEVER_EMIT_b81cf2
      until_bash: |
        set -euo pipefail
        # Archon v0.9.0 exports NO ARTIFACTS_DIR env var into until_bash; bare
        # $ARTIFACTS_DIR here is TEXTUALLY SUBSTITUTED by archon before execution
        # (probe-verified; ${ARTIFACTS_DIR} brace form would NOT substitute).
        # The validator's verdict JSON is captured on every evaluation so a
        # failing guard leaves a forensic trail instead of a silent false.
        node scripts/automation/package-plan-complete.mjs --package "$ARGUMENTS" \
          --artifacts-dir "$ARTIFACTS_DIR" > "$ARTIFACTS_DIR/scoped-plan-guard-last.json"
      nodes:
        - id: scoped-plan-iterate
          command: foresift-wp-plan
          effort: high
          idle_timeout: 1800000
        - id: plan-recheck
          depends_on: [scoped-plan-iterate]   # siblings without an edge run concurrently
          bash: |
            set +e
            node scripts/automation/package-plan-complete.mjs --package "$ARGUMENTS" \
              > "$ARTIFACTS_DIR/plan-completeness.json" 2>&1
            echo "PLAN_RECHECK_EXIT=$?"

  # ── PHASE 2 ROUTER: deterministic implementation-completeness check ─────────
  - id: impl-status
    depends_on: [scoped-plan]
    trigger_rule: one_success   # scoped-plan may legitimately be skipped (already complete)
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/package-implement-complete.mjs --package "$ARGUMENTS" \
        > "$ARTIFACTS_DIR/implement-completeness.json" 2>&1
      if [ $? -eq 0 ]; then echo "IMPLEMENT_COMPLETE"; else echo "IMPLEMENT_INCOMPLETE"; fi

  # ── PHASE 2: IMPLEMENTATION (bounded continuation loop, additive commits) ───
  # Each iteration: read current tasks/implementation state, implement the next
  # coherent unfinished unit, run focused verification, commit additively, and
  # leave useful partial work persisted for the next iteration. A clean Claude
  # exit with tasks remaining simply starts another iteration — no human
  # "continue" ever needed. Completion is decided solely by the deterministic
  # guard; heavy verification stays in the downstream gate.
  - id: implement
    depends_on: [impl-status]
    when: "$impl-status.output == 'IMPLEMENT_INCOMPLETE'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 12
      fresh_context: true
      until: WP_IMPL_LOOP_TEXT_SIGNAL_NEVER_EMIT_e47a09
      until_bash: |
        set -euo pipefail
        # Verdict captured on every evaluation for forensics (see scoped-plan guard).
        # This validator needs no artifacts dir: it inspects repo files only.
        node scripts/automation/package-implement-complete.mjs --package "$ARGUMENTS" \
          > "$ARTIFACTS_DIR/implement-guard-last.json"
      nodes:
        - id: implement-iterate
          command: foresift-wp-implement-optimized
          effort: high
          idle_timeout: 1800000
        - id: impl-recheck
          depends_on: [implement-iterate]   # siblings without an edge run concurrently
          bash: |
            set +e
            node scripts/automation/package-implement-complete.mjs --package "$ARGUMENTS" \
              > "$ARTIFACTS_DIR/implement-completeness.json" 2>&1
            echo "IMPL_RECHECK_EXIT=$?"

  # ── PHASE 3: DETERMINISTIC PACKAGE GATE + BOUNDED TARGETED REPAIR LOOP ──────
  # The gate is the authority (AI is never the authority). This node runs the
  # FULL gate via wp:full-gate (attestation runner): on PASS it writes the
  # exact-head attestation reused by every downstream verification point; on
  # FAIL it writes NO attestation plus a structured per-check manifest. Only a
  # FAILED gate opens the bounded repair loop, whose body repairs against the
  # manifest, re-verifies TARGETED (not full), and runs the FULL gate once more
  # only when targeted evidence is green or unusable.
  - id: gate-router
    depends_on: [implement]
    trigger_rule: one_success   # implement may legitimately be skipped (already complete)
    idle_timeout: 1800000
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      if node scripts/automation/package-full-gate.mjs --check --package "$ARGUMENTS" \
           --artifacts-dir "$ARTIFACTS_DIR" >/dev/null 2>&1; then
        printf '{"passed":true,"exitCode":0,"attestationReuse":true}\n' >"$ARTIFACTS_DIR/gate-result.json"
        echo "GATE_PASSED_ATTESTATION_REUSE"
        exit 0
      fi
      node scripts/automation/package-full-gate.mjs --run --package "$ARGUMENTS" \
        --artifacts-dir "$ARTIFACTS_DIR" >"$ARTIFACTS_DIR/gate-log.txt" 2>&1
      code=$?
      if [ "$code" -eq 0 ]; then
        printf '{"passed":true,"exitCode":0}\n' >"$ARTIFACTS_DIR/gate-result.json"
        echo "GATE_PASSED"
      else
        printf '{"passed":false,"exitCode":%d}\n' "$code" >"$ARTIFACTS_DIR/gate-result.json"
        echo "GATE_FAILED"
      fi
    timeout: 1800000

  - id: gate-repair-loop
    depends_on: [gate-router]
    when: "$gate-router.output == 'GATE_FAILED'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: GATE_LOOP_TEXT_SIGNAL_NEVER_EMIT_f04d67
      until_bash: |
        set -euo pipefail
        # The artifacts dir reaches this guard as argv[1] via archon's bare-form
        # $ARTIFACTS_DIR textual substitution — process.env.ARTIFACTS_DIR is NOT
        # exported into until_bash (probe-verified; reading it here yields
        # "undefined" and the guard would fail forever).
        node -e 'const fs=require("fs");const f=process.argv[1]+"/gate-result.json";if(!fs.existsSync(f))process.exit(1);const r=JSON.parse(fs.readFileSync(f,"utf8"));process.exit(r.passed===true?0:1)' "$ARTIFACTS_DIR"
      nodes:
        - id: gate-repair
          command: foresift-wp-gate-repair
          effort: high
          idle_timeout: 1800000
        - id: repair-targeted-recheck
          depends_on: [gate-repair]   # serialize: recheck must observe post-repair state
          bash: |
            set +e
            node scripts/automation/package-targeted-verify.mjs \
              --manifest "$ARTIFACTS_DIR/full-gate-result.json" \
              --gate-log "$ARTIFACTS_DIR/gate-log.txt" \
              --artifacts-dir "$ARTIFACTS_DIR" \
              >"$ARTIFACTS_DIR/targeted-recheck-log.txt" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then echo "TARGETED_GREEN";
            elif [ "$code" -eq 3 ]; then echo "TARGETED_ESCALATED";
            else echo "TARGETED_RED"; fi
            exit 0   # verdict recorded in targeted-verify-result.json; routing stays in-workflow
        - id: repair-final-full
          depends_on: [repair-targeted-recheck]
          timeout: 1800000
          bash: |
            set +e
            # Route on the PERSISTED targeted verdict (no sibling-output reads in bash).
            mode=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).mode||"?")}catch{console.log("?")}' "$ARTIFACTS_DIR/targeted-verify-result.json")
            green=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).allGreen===true?"yes":"no")}catch{console.log("no")}' "$ARTIFACTS_DIR/targeted-verify-result.json")
            if [ "$mode" = "TARGETED" ] && [ "$green" != "yes" ]; then
              echo "SKIP_TARGETED_RED"   # still red ⇒ next repair iteration; no FULL spend
              exit 0
            fi
            # Targeted green OR escalated evidence ⇒ establish exact-head FULL evidence,
            # reusing a still-valid attestation instead of re-executing the gate.
            if node scripts/automation/package-full-gate.mjs --check --package "$ARGUMENTS" \
                 --artifacts-dir "$ARTIFACTS_DIR" >/dev/null 2>&1; then
              printf '{"passed":true,"exitCode":0,"attestationReuse":true}\n' >"$ARTIFACTS_DIR/gate-result.json"
              echo "ATTESTATION_REUSE"
              exit 0
            fi
            node scripts/automation/package-full-gate.mjs --run --package "$ARGUMENTS" \
              --artifacts-dir "$ARTIFACTS_DIR" >"$ARTIFACTS_DIR/gate-log.txt" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              printf '{"passed":true,"exitCode":0}\n' >"$ARTIFACTS_DIR/gate-result.json"
              echo "FINAL_FULL_PASSED"
            else
              printf '{"passed":false,"exitCode":%d}\n' "$code" >"$ARTIFACTS_DIR/gate-result.json"
              echo "FINAL_FULL_FAILED"
            fi

  # ── PHASE 4: PULL REQUEST (deterministic — zero Claude invocations, §13) ───
  # package-create-pr.mjs refuses on a dirty tracked tree, pushes the current
  # branch, composes the body from milestone metadata + persisted gate
  # evidence, discovers-or-creates exactly ONE PR against main, and persists
  # .pr-number for the review block and final landing.
  - id: create-pr
    depends_on: [gate-router, gate-repair-loop]
    trigger_rule: none_failed_min_one_success   # gate-router always completes; repair loop may be skipped
    bash: |
      set -euo pipefail
      node scripts/automation/package-create-pr.mjs \
        --package "$ARGUMENTS" \
        --branch "$(git rev-parse --abbrev-ref HEAD)" \
        --artifacts-dir "$ARTIFACTS_DIR"

  # ── PHASE 5: COMPREHENSIVE INDEPENDENT REVIEW + AUTO-FIX ───────────────────
  # Bundled 9-node review sub-DAG: verify-pr-base -> scope -> sync ->
  # 5 parallel fresh-context review agents -> synthesize (posts PR comment) ->
  # implement CRITICAL/HIGH fixes. Not reimplemented here.
  # A deterministic HEAD snapshot BEFORE the block and a structured GitHub-
  # state collection AFTER it give the convergence router machine-checkable
  # evidence of what review did to the tree (V2 task spec §11).
  - id: pre-review-snapshot
    depends_on: [create-pr]
    bash: |
      set -euo pipefail
      mkdir -p "$ARTIFACTS_DIR"
      HEAD_SHA=$(git rev-parse HEAD)
      printf '{"headSha":"%s"}\n' "$HEAD_SHA" > "$ARTIFACTS_DIR/.review-head-snapshot.json"
      echo "REVIEW_HEAD_SNAPSHOT=$HEAD_SHA"

  - id: review
    include: archon-review-block
    depends_on: [pre-review-snapshot]

  - id: review-outcome
    depends_on: [review]
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      # The collector NEVER fails this node: any missing/unknown input becomes
      # verdict.valid=false, which routes CONVERGENCE_REQUIRED downstream.
      node scripts/automation/review-outcome-collector.mjs \
        --artifacts-dir "$ARTIFACTS_DIR" \
        >"$ARTIFACTS_DIR/review-outcome-log.txt" 2>&1
      echo "REVIEW_OUTCOME_COLLECTED"

  # ── PHASE 6 ROUTER: deterministic convergence decision (fail-closed) ────────
  # CONVERGENCE_NOT_REQUIRED requires ALL of: APPROVED review verdict, HEAD
  # unchanged across the whole review window, an exact-head FULL-gate
  # attestation matching the CURRENT identity, and implementation completeness.
  # ANY missing/contradictory evidence ⇒ the convergence stage runs (today's
  # always-run behavior), so this optimization can never skip required work.
  - id: convergence-router
    depends_on: [review-outcome]
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/convergence-router.mjs --package "$ARGUMENTS" \
        --artifacts-dir "$ARTIFACTS_DIR" >"$ARTIFACTS_DIR/router-log.txt" 2>&1
      code=$?
      if [ "$code" -eq 0 ]; then echo "CONVERGENCE_NOT_REQUIRED"; else echo "CONVERGENCE_REQUIRED"; fi

  # ── PHASE 6: SPEC KIT CONVERGE LOOP (bounded, fresh contexts; routed) ──────
  # Runs ONLY when the deterministic router says CONVERGENCE_REQUIRED. Each
  # iteration: converge against spec/plan/tasks -> TARGETED re-verification of
  # whatever the structured gate manifest flagged -> one exact-head FULL gate
  # (reusing valid attestation evidence) -> independent judge over all three
  # transcripts. Same-iteration prompt refs ($converge.output etc.) are
  # verified Archon v0.9.0 behavior; bash nodes route on PERSISTED verdict
  # files instead of sibling outputs. The judge may signal CONVERGED only when
  # the FULL-gate evidence at the current head is green AND no required work
  # remains. Hard limit of 4 iterations. The authoritative check is re-run
  # deterministically by the final phase regardless.
  - id: convergence
    depends_on: [convergence-router]
    when: "$convergence-router.output == 'CONVERGENCE_REQUIRED'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: CONVERGED
      nodes:
        - id: converge
          command: foresift-wp-converge
          effort: high
          idle_timeout: 1800000
        - id: converge-targeted-recheck
          depends_on: [converge]   # serialize: recheck must observe post-converge state
          bash: |
            set +e
            node scripts/automation/package-targeted-verify.mjs \
              --manifest "$ARTIFACTS_DIR/full-gate-result.json" \
              --gate-log "$ARTIFACTS_DIR/gate-log.txt" \
              --artifacts-dir "$ARTIFACTS_DIR" \
              >"$ARTIFACTS_DIR/targeted-recheck-log.txt" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then echo "TARGETED_GREEN";
            elif [ "$code" -eq 3 ]; then echo "TARGETED_ESCALATED";
            else echo "TARGETED_RED"; fi
            exit 0   # verdict recorded in targeted-verify-result.json
        - id: converge-final-full
          depends_on: [converge-targeted-recheck]
          timeout: 1800000
          bash: |
            set +e
            mode=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).mode||"?")}catch{console.log("?")}' "$ARTIFACTS_DIR/targeted-verify-result.json")
            green=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).allGreen===true?"yes":"no")}catch{console.log("no")}' "$ARTIFACTS_DIR/targeted-verify-result.json")
            if [ "$mode" = "TARGETED" ] && [ "$green" != "yes" ]; then
              echo "SKIP_TARGETED_RED"   # still red ⇒ next converge iteration; no FULL spend
              exit 0
            fi
            if node scripts/automation/package-full-gate.mjs --check --package "$ARGUMENTS" \
                 --artifacts-dir "$ARTIFACTS_DIR" >/dev/null 2>&1; then
              printf '{"passed":true,"exitCode":0,"attestationReuse":true}\n' >"$ARTIFACTS_DIR/gate-result.json"
              echo "ATTESTATION_REUSE"
              exit 0
            fi
            node scripts/automation/package-full-gate.mjs --run --package "$ARGUMENTS" \
              --artifacts-dir "$ARTIFACTS_DIR" >"$ARTIFACTS_DIR/gate-log.txt" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              printf '{"passed":true,"exitCode":0}\n' >"$ARTIFACTS_DIR/gate-result.json"
              echo "FINAL_FULL_PASSED"
            else
              printf '{"passed":false,"exitCode":%d}\n' "$code" >"$ARTIFACTS_DIR/gate-result.json"
              echo "FINAL_FULL_FAILED"
            fi
        - id: judge
          prompt: |
            You are the independent convergence judge for Foresift work package
            "$ARGUMENTS". You have read-only intent: verify claims, never fix code.

            Convergence agent report (most recent iteration):
            $converge.output

            Targeted re-verification transcript after that report ("✅ TARGETED
            VERIFICATION GREEN" means the failed checks now pass):
            $converge-targeted-recheck.output

            Final FULL-gate evidence at the current head. FINAL_FULL_PASSED or
            ATTESTATION_REUSE means exact-head full verification holds;
            SKIP_TARGETED_RED means verification is NOT yet established:
            $converge-final-full.output

            Verify against specs/implementation/current-milestone.json (package
            "$ARGUMENTS"), its Spec Kit artifacts under specs/<package-id>/, and
            the actual code: every listed requirement implemented with tests, no
            known missing acceptance criterion, AND exact-head FULL-gate
            evidence green (FINAL_FULL_PASSED or ATTESTATION_REUSE).

            End your reply with EXACTLY one of:
            <promise>CONVERGED</promise>   — only if the FULL-gate evidence is green AND nothing required is missing
            <promise>NOT_CONVERGED</promise> — otherwise; precede it with a short list of what is missing
          depends_on: [converge-final-full]
          model: large
          allowed_tools: [Read, Glob, Grep]

  # ── PHASE 7: MECHANICAL FINAL LANDING + BOUNDED AI FALLBACK (§14) ──────────
  # The clean path is fully deterministic: package-final-land.mjs re-establishes
  # exact-head FULL-gate evidence (--check reuse; at most ONE fresh --run),
  # composes the PR body, and runs the mechanical lander (pinned-head CI wait →
  # squash-merge), persisting land-result.json on EVERY terminal path. Only a
  # non-zero exit routes to the bounded AI fallback — which must diagnose,
  # fix forward with NEW COMMITS, and END by re-running the mechanical script.
  - id: final-land-router
    depends_on: [convergence-router, convergence]
    trigger_rule: none_failed_min_one_success   # convergence stage may legitimately be skipped (router: NOT_REQUIRED)
    timeout: 3600000   # includes the exact-head CI wait inside package-land.mjs
    bash: |
      set +e
      node scripts/automation/package-final-land.mjs \
        --package "$ARGUMENTS" \
        --branch "$(git rev-parse --abbrev-ref HEAD)" \
        --artifacts-dir "$ARTIFACTS_DIR" \
        >"$ARTIFACTS_DIR/final-land-log.txt" 2>&1
      code=$?
      cat "$ARTIFACTS_DIR/final-land-log.txt"
      if [ "$code" -eq 0 ]; then echo "LANDED_MECHANICAL";
      else echo "LANDING_NEEDS_AI"; fi
      exit 0   # routing token only; the verdict lives in land-result.json

  - id: ai-landing-fallback
    command: foresift-wp-ci-merge-optimized
    when: "$final-land-router.output == 'LANDING_NEEDS_AI'"
    depends_on: [final-land-router]
    context: fresh
    idle_timeout: 1800000

  - id: landing-verifier
    depends_on: [final-land-router, ai-landing-fallback]
    trigger_rule: none_failed_min_one_success   # fallback is legitimately SKIPPED on the clean mechanical path
    bash: |
      set -euo pipefail
      node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(r.schema!=="foresift/final-land@1"||r.merged!==true){console.error("NOT LANDED:",JSON.stringify(r));process.exit(3)}' "$ARTIFACTS_DIR/land-result.json"
      echo "LANDED_VERIFIED"
