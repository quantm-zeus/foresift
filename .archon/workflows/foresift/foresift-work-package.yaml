name: foresift-work-package
description: |
  Foresift autonomous implementation of exactly ONE work package from the current
  milestone (specs/implementation/current-milestone.json). Invoke as:

    archon workflow run foresift-work-package --branch foresift/<package-id> "<package-id>"

  Pipeline: deterministic preflight -> Spec Kit scoped plan/tasks/analyze inside
  a BOUNDED CONTINUATION LOOP -> fresh-context implementation continuation loop
  (each iteration continues persisted partial work; completion decided by
  deterministic guards, never by AI promises) -> deterministic package gate with
  bounded repair loop -> PR -> comprehensive independent review (bundled
  archon-review-block: 5 parallel review agents + automatic CRITICAL/HIGH
  fixes) -> Spec Kit convergence loop (bounded) -> final deterministic gate ->
  exact-head CI wait -> machine squash merge. No human approval gate. Additive
  commits only; never amend/rebase/force.

  A Claude turn ending cleanly is NOT stage completion: long stages loop under
  deterministic `until_bash` guards (the `until` text signals are sentinels
  agents are instructed NEVER to emit). Loop exhaustion fails the stage;
  recovery belongs to the autopilot supervisor.

  ARCHON v0.9.0 LOOP SEMANTICS this layout relies on (verified empirically):
    - every loop iteration runs its FULL body before the guard is evaluated;
    - `when:` inside a loop body CANNOT see same-iteration sibling outputs, so
      conditional AI gating is done by TOP-LEVEL status nodes routing around
      whole loops, and loop bodies run unconditionally (repair -> re-check);
    - loop-body siblings WITHOUT an explicit depends_on edge run CONCURRENTLY,
      so AI->recheck pairs are always serialized with depends_on;
    - prompt interpolation CAN read top-level and same-iteration siblings;
    - until_bash guards get NO ARTIFACTS_DIR environment variable: only
      BARE-FORM `$VAR` references ($ARTIFACTS_DIR/$WORKFLOW_ID/$STATE_DIR/
      $BASE_BRANCH/$DOCS_DIR) are TEXTUALLY SUBSTITUTED into the command
      string before execution — `${ARTIFACTS_DIR}` brace form and env reads
      (process.env.ARTIFACTS_DIR) do NOT work inside guards, while regular
      workflow bash nodes receive ARTIFACTS_DIR as a real env var. Guards
      therefore pass artifact paths as arguments: `--artifacts-dir "$ARTIFACTS_DIR"`.
      This exact gap silently exhausted scoped-plan 4x on 2026-08-22/23 while
      plan-recheck bash nodes exited 0 (ADR 0004).

  NOT for: planning or auditing milestones (use foresift-milestone-control),
  ad-hoc fixes (use archon-assist), or implementing anything outside the
  selected package.

provider: claude
effort: high
tags: [foresift, autonomous]

nodes:
  # ── PHASE 0: DETERMINISTIC PREFLIGHT (fail closed before any AI spend) ─────
  - id: preflight
    bash: |
      set -euo pipefail
      node scripts/automation/preflight.mjs --package "$ARGUMENTS" --branch "$(git rev-parse --abbrev-ref HEAD)"
    timeout: 600000
    retry:
      max_attempts: 2
      delay_ms: 10000
      on_error: transient

  # ── PHASE 1 ROUTER: deterministic planning-completeness check ───────────────
  - id: plan-status
    depends_on: [preflight]
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/package-plan-complete.mjs --package "$ARGUMENTS" \
        > "$ARTIFACTS_DIR/plan-completeness.json" 2>&1
      if [ $? -eq 0 ]; then echo "WP_PLAN_COMPLETE"; else echo "WP_PLAN_INCOMPLETE"; fi

  # ── PHASE 1: SCOPED SPEC KIT PLANNING (bounded continuation loop) ────────────
  # Runs only when the deterministic router says planning is incomplete. Each
  # iteration inspects existing partial specs/<id>/ and prior artifacts and
  # CONTINUES them (never regenerates correct sections); the re-check refreshes
  # the guard input. Completion is decided solely by the deterministic
  # validator; the `until` sentinel must NEVER be emitted by an agent.
  - id: scoped-plan
    depends_on: [plan-status]
    when: "$plan-status.output == 'WP_PLAN_INCOMPLETE'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: WP_PLAN_LOOP_TEXT_SIGNAL_NEVER_EMIT_b81cf2
      until_bash: |
        set -euo pipefail
        # Archon v0.9.0 exports NO ARTIFACTS_DIR env var into until_bash; bare
        # $ARTIFACTS_DIR here is TEXTUALLY SUBSTITUTED by archon before execution
        # (probe-verified; ${ARTIFACTS_DIR} brace form would NOT substitute).
        # The validator's verdict JSON is captured on every evaluation so a
        # failing guard leaves a forensic trail instead of a silent false.
        node scripts/automation/package-plan-complete.mjs --package "$ARGUMENTS" \
          --artifacts-dir "$ARTIFACTS_DIR" > "$ARTIFACTS_DIR/scoped-plan-guard-last.json"
      nodes:
        - id: scoped-plan-iterate
          command: foresift-wp-plan
          effort: high
          idle_timeout: 1800000
        - id: plan-recheck
          depends_on: [scoped-plan-iterate]   # siblings without an edge run concurrently
          bash: |
            set +e
            node scripts/automation/package-plan-complete.mjs --package "$ARGUMENTS" \
              > "$ARTIFACTS_DIR/plan-completeness.json" 2>&1
            echo "PLAN_RECHECK_EXIT=$?"

  # ── PHASE 2 ROUTER: deterministic implementation-completeness check ─────────
  - id: impl-status
    depends_on: [scoped-plan]
    trigger_rule: one_success   # scoped-plan may legitimately be skipped (already complete)
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      node scripts/automation/package-implement-complete.mjs --package "$ARGUMENTS" \
        > "$ARTIFACTS_DIR/implement-completeness.json" 2>&1
      if [ $? -eq 0 ]; then echo "IMPLEMENT_COMPLETE"; else echo "IMPLEMENT_INCOMPLETE"; fi

  # ── PHASE 2: IMPLEMENTATION (bounded continuation loop, additive commits) ───
  # Each iteration: read current tasks/implementation state, implement the next
  # coherent unfinished unit, run focused verification, commit additively, and
  # leave useful partial work persisted for the next iteration. A clean Claude
  # exit with tasks remaining simply starts another iteration — no human
  # "continue" ever needed. Completion is decided solely by the deterministic
  # guard; heavy verification stays in the downstream gate.
  - id: implement
    depends_on: [impl-status]
    when: "$impl-status.output == 'IMPLEMENT_INCOMPLETE'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 12
      fresh_context: true
      until: WP_IMPL_LOOP_TEXT_SIGNAL_NEVER_EMIT_e47a09
      until_bash: |
        set -euo pipefail
        # Verdict captured on every evaluation for forensics (see scoped-plan guard).
        # This validator needs no artifacts dir: it inspects repo files only.
        node scripts/automation/package-implement-complete.mjs --package "$ARGUMENTS" \
          > "$ARTIFACTS_DIR/implement-guard-last.json"
      nodes:
        - id: implement-iterate
          command: foresift-wp-implement
          effort: high
          idle_timeout: 1800000
        - id: impl-recheck
          depends_on: [implement-iterate]   # siblings without an edge run concurrently
          bash: |
            set +e
            node scripts/automation/package-implement-complete.mjs --package "$ARGUMENTS" \
              > "$ARTIFACTS_DIR/implement-completeness.json" 2>&1
            echo "IMPL_RECHECK_EXIT=$?"

  # ── PHASE 3: DETERMINISTIC PACKAGE GATE + BOUNDED REPAIR LOOP ────────────────
  # The gate is the authority (AI is never the authority). The captured,
  # non-failing router records pass/fail once; only a FAILED gate opens the
  # bounded repair loop, whose body repairs and RE-RUNS the gate — so a
  # completed implementation stage can always be repaired until the gate passes
  # (or repair iterations exhaust and recovery escalates).
  - id: gate-router
    depends_on: [implement]
    trigger_rule: one_success   # implement may legitimately be skipped (already complete)
    idle_timeout: 1800000
    bash: |
      set +e
      mkdir -p "$ARTIFACTS_DIR"
      pnpm foresift:gate -- --package "$ARGUMENTS" >"$ARTIFACTS_DIR/gate-log.txt" 2>&1
      code=$?
      if [ "$code" -eq 0 ]; then
        printf '{"passed":true,"exitCode":0}\n' >"$ARTIFACTS_DIR/gate-result.json"
        echo "GATE_PASSED"
      else
        printf '{"passed":false,"exitCode":%d}\n' "$code" >"$ARTIFACTS_DIR/gate-result.json"
        echo "GATE_FAILED"
      fi
    timeout: 1800000

  - id: gate-repair-loop
    depends_on: [gate-router]
    when: "$gate-router.output == 'GATE_FAILED'"
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: GATE_LOOP_TEXT_SIGNAL_NEVER_EMIT_f04d67
      until_bash: |
        set -euo pipefail
        # The artifacts dir reaches this guard as argv[1] via archon's bare-form
        # $ARTIFACTS_DIR textual substitution — process.env.ARTIFACTS_DIR is NOT
        # exported into until_bash (probe-verified; reading it here yields
        # "undefined" and the guard would fail forever).
        node -e 'const fs=require("fs");const f=process.argv[1]+"/gate-result.json";if(!fs.existsSync(f))process.exit(1);const r=JSON.parse(fs.readFileSync(f,"utf8"));process.exit(r.passed===true?0:1)' "$ARTIFACTS_DIR"
      nodes:
        - id: gate-repair
          command: foresift-wp-gate-repair
          effort: high
          idle_timeout: 1800000
        - id: gate-rerun
          depends_on: [gate-repair]   # serialize: rerun must observe post-repair state (feeds until_bash)
          bash: |
            set +e
            pnpm foresift:gate -- --package "$ARGUMENTS" >"$ARTIFACTS_DIR/gate-log.txt" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              printf '{"passed":true,"exitCode":0}\n' >"$ARTIFACTS_DIR/gate-result.json"
              echo "GATE_PASSED"
            else
              printf '{"passed":false,"exitCode":%d}\n' "$code" >"$ARTIFACTS_DIR/gate-result.json"
              echo "GATE_FAILED"
            fi
          timeout: 1800000

  # ── PHASE 4: PULL REQUEST ──────────────────────────────────────────────────
  - id: create-pr
    command: foresift-wp-create-pr
    depends_on: [gate-router, gate-repair-loop]
    trigger_rule: none_failed_min_one_success   # gate-router always completes; repair loop may be skipped
    context: fresh

  # ── PHASE 5: COMPREHENSIVE INDEPENDENT REVIEW + AUTO-FIX ───────────────────
  # Bundled 9-node review sub-DAG: verify-pr-base -> scope -> sync ->
  # 5 parallel fresh-context review agents -> synthesize (posts PR comment) ->
  # implement CRITICAL/HIGH fixes. Not reimplemented here.
  - id: review
    include: archon-review-block
    depends_on: [create-pr]

  # ── PHASE 6: SPEC KIT CONVERGENCE LOOP (bounded, fresh contexts) ───────────
  # Each iteration: converge against spec/plan/tasks -> deterministic gate
  # (captured, non-failing) -> independent judge. Same-iteration prompt refs
  # ($converge.output / $gate-iter.output) are verified Archon v0.9.0 behavior.
  # The judge may only signal CONVERGED when the gate reported success AND no
  # required work remains. Hard limit of 4 iterations. The authoritative check
  # is re-run deterministically by the final phase regardless.
  - id: convergence
    depends_on: [review]
    idle_timeout: 1800000
    loop_group:
      max_iterations: 4
      fresh_context: true
      until: CONVERGED
      nodes:
        - id: converge
          command: foresift-wp-converge
          effort: high
          idle_timeout: 1800000
        - id: gate-iter
          bash: |
            set +e
            pnpm foresift:gate -- --package "$ARGUMENTS"
            echo "GATE_EXIT=$?"
          depends_on: [converge]
          timeout: 1800000
        - id: judge
          prompt: |
            You are the independent convergence judge for Foresift work package
            "$ARGUMENTS". You have read-only intent: verify claims, never fix code.

            Convergence agent report (most recent iteration):
            $converge.output

            Deterministic package gate transcript ("GATE_EXIT=0" means every
            check passed; anything else is a failure):
            $gate-iter.output

            Verify against specs/implementation/current-milestone.json (package
            "$ARGUMENTS"), its Spec Kit artifacts under specs/<package-id>/, and
            the actual code: every listed requirement implemented with tests, no
            known missing acceptance criterion, and GATE_EXIT=0.

            End your reply with EXACTLY one of:
            <promise>CONVERGED</promise>   — only if the gate passed AND nothing required is missing
            <promise>NOT_CONVERGED</promise> — otherwise; precede it with a short list of what is missing
          depends_on: [gate-iter]
          model: large
          allowed_tools: [Read, Glob, Grep]

  # ── PHASE 7: FINAL DETERMINISTIC GATE + EXACT-HEAD CI + MERGE ──────────────
  - id: ci-merge
    command: foresift-wp-ci-merge
    depends_on: [convergence]
    context: fresh
    idle_timeout: 1800000
