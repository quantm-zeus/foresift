name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (spec, format, lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Specification integrity verification
        run: pnpm spec:verify

      - name: Formatting check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Aggregate verification
        run: pnpm verify
