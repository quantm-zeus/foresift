name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pushes on the same branch are cancelled — each push fully
# re-verifies, so only the newest head's verdict matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Classify whether this is a state-only change (only whitelisted planning/state
  # files changed) or a full product change. This gates which test jobs run.
  #
  # STATE_ONLY_WHITELIST (from ci-authority.mjs):
  #   - specs/implementation/current-milestone.json
  #   - specs/implementation/roadmap.json
  #   - specs/g0-<id>/(plan|spec|tasks).md
  #
  # Fail-closed: any unknown/unclassified path → FULL CI.
  classify:
    name: Classify diff (state-only vs full)
    runs-on: ubuntu-latest
    outputs:
      state_only: ${{ steps.classify.outputs.state_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        run: |
          # Get list of changed files relative to base
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # For push to main: compare to parent
            BASE="${GITHUB_SHA}^"
            HEAD="${GITHUB_SHA}"
          fi

          node scripts/automation/classify-ci-diff.mjs --base "$BASE" --head "$HEAD"

  gates:
    name: Fast Gates (spec, format, lint, types, node-compat, security)
    runs-on: ubuntu-latest
    needs: [classify]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Specification integrity verification
        run: pnpm spec:verify

      - name: Formatting check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Node.js runtime compatibility
        run: pnpm test:node-compat

      - name: Prohibited-capability scanner
        run: node scripts/scan-prohibited-capabilities/cli.mjs

  test-state-control-plane:
    name: Tests (State Control Plane)
    runs-on: ubuntu-latest
    needs: [classify]
    if: needs.classify.outputs.state_only == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Bun Test (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run State Control Plane Tests
        run: pnpm test:state-control-plane

  test-pure:
    name: Tests (Pure Workload)
    runs-on: ubuntu-latest
    needs: [classify]
    # Skip for state-only changes: these tests cannot be affected by state/planning files.
    if: needs.classify.outputs.state_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Bun Test (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Pure Tests
        run: pnpm test:pure

  test-process-meta:
    name: Tests (Process & Meta-Gate Workloads)
    runs-on: ubuntu-latest
    needs: [classify]
    # Final containment layer: the coordinator already bounds each group's
    # process tree, but a runner-level budget guarantees the job itself can
    # never wedge a CI pipeline (observed 2026-08-29: two attempts produced
    # zero coordinator output for 23+ minutes).
    timeout-minutes: 45
    # Skip for state-only changes: these tests cannot be affected by state/planning files.
    if: needs.classify.outputs.state_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Bun Test (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run Process and Meta Tests
        run: pnpm test:process-meta

  test-pglite:
    name: Tests (Database PGlite Workload)
    runs-on: ubuntu-latest
    needs: [classify]
    # Skip for state-only changes: these tests cannot be affected by state/planning files.
    if: needs.classify.outputs.state_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Bun Test (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run PGlite Tests
        run: pnpm test:pglite

  verify:
    name: Verify (spec, format, lint, types, tests)
    runs-on: ubuntu-latest
    needs: [classify, gates, test-state-control-plane, test-pure, test-process-meta, test-pglite]
    if: always()
    steps:
      - name: Assert all required verification jobs passed
        run: |
          STATE_ONLY="${{ needs.classify.outputs.state_only }}"
          GATES="${{ needs.gates.result }}"
          TEST_STATE="${{ needs.test-state-control-plane.result }}"
          TEST_PURE="${{ needs.test-pure.result }}"
          TEST_PROCESS_META="${{ needs.test-process-meta.result }}"
          TEST_PGLITE="${{ needs.test-pglite.result }}"

          echo "Classification: state_only=${STATE_ONLY}"
          echo "Gates: ${GATES}"
          echo "test-state-control-plane: ${TEST_STATE}"
          echo "test-pure: ${TEST_PURE}"
          echo "test-process-meta: ${TEST_PROCESS_META}"
          echo "test-pglite: ${TEST_PGLITE}"

          if [ "$GATES" != "success" ]; then
            echo "FAILED: gates job did not succeed"
            exit 1
          fi

          if [ "$STATE_ONLY" = "true" ]; then
            if [ "$TEST_STATE" != "success" ]; then
              echo "FAILED: state control plane tests did not succeed"
              exit 1
            fi
            echo "State-only path: state control plane tests and gates passed. VERIFY OK."
          else
            # Full path: all test jobs must have succeeded.
            if [ "$TEST_PURE" != "success" ] || \
               [ "$TEST_PROCESS_META" != "success" ] || \
               [ "$TEST_PGLITE" != "success" ]; then
              echo "FAILED: one or more test jobs did not succeed"
              echo "  test-pure=${TEST_PURE} test-process-meta=${TEST_PROCESS_META} test-pglite=${TEST_PGLITE}"
              exit 1
            fi
            echo "Full CI path: all parallel verification jobs passed. VERIFY OK."
          fi
