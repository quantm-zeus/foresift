name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Superseded pushes on the same branch are cancelled — each push fully
# re-verifies, so only the newest head's verdict matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (spec, format, lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm (pinned via package.json packageManager)
        uses: pnpm/action-setup@v6.0.10

      - name: Install Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Specification integrity verification
        run: pnpm spec:verify

      - name: Formatting check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Static release gate for the permanent read-only boundary. Runs as its
      # own step so a CLI-only regression (inverted exit, broadened exclusion)
      # fails CI even though the vitest suite also pins the exit contract.
      - name: Prohibited-capability scanner
        run: node scripts/scan-prohibited-capabilities/cli.mjs
