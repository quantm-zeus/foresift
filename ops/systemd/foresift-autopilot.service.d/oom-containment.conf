# OOM containment (2026-09-08 incident): kernel OOM-killed bun test processes
# three times tonight (19:34 anon-rss 5.47GB, 20:09 9.79GB, 20:56 9.79GB) —
# each a global OOM that also threatened the control plane and the maintainer
# pane. The autopilot cgroup contains every detached Archon run (KillMode=
# process keeps them across restarts), so bounding THIS cgroup turns a
# host-killing runaway into a contained, kernel-mediated kill of the largest
# child inside it. MemoryHigh throttles first (soft reclaim pressure);
# MemoryMax is the hard wall. 12G hard / 10G high on a 16G host leaves ≥4G
# for the host, the maintainer tmux service, and the dashboard.
# Remove with: rm ~/.config/systemd/user/foresift-autopilot.service.d/oom-containment.conf
[Service]
MemoryHigh=10G
MemoryMax=12G
