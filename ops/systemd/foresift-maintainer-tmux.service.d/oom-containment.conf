# OOM containment (2026-09-08): the maintainer pane's own bun test runs
# OOM-killed the host at 9.79GB (20:56) and took the pane with them. Bound
# the dedicated tmux server cgroup: hard wall below the host's danger zone,
# keeping the control plane (autopilot ~50MB, dashboard ~4MB) safe.
# Remove with: rm ~/.config/systemd/user/foresift-maintainer-tmux.service.d/oom-containment.conf
[Service]
MemoryHigh=6G
MemoryMax=8G
